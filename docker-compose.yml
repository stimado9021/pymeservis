version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: pymes-postgres
    environment:
      POSTGRES_USER: pymes
      POSTGRES_PASSWORD: pymes
      POSTGRES_DB: pymes_cobranza
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pymes-redis
    ports:
      - "6380:6379"

volumes:
  pgdata:
